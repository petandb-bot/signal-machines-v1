name: Verify pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify production AudioWorklet and legacy presets
        run: npm run verify:build
      - name: Verify opt-in LIVING modes in emitted worklet
        run: node scripts/verify-living-worklet.mjs
      - name: Verify SYMPATHY in emitted worklet
        run: node scripts/verify-sympathy-worklet.mjs
      - name: Validate Phase 1 audio architecture
        run: node scripts/render-sound-architecture.mjs 60
      - name: Verify frozen v0.21 references and render Phase 6
        run: |
          npm run render:phase6
          mkdir -p dist/listening/audio dist/listening/presets
          cp -R public/listening/audio/phase6 dist/listening/audio/
          cp -R public/listening/presets/phase6 public/listening/presets/v021 dist/listening/presets/
          cp public/listening/phase6-*.html dist/listening/
      - name: Upload short musical A/B review
        uses: actions/upload-artifact@v5
        with:
          name: phase6-short-ab
          path: |
            dist/listening/phase6-short.html
            dist/listening/audio/phase6/*-60s-*.wav
            dist/listening/audio/phase6/*-report.json
            dist/listening/presets/phase6/
            dist/listening/presets/v021/
          if-no-files-found: error
          retention-days: 14
      - name: Upload long musical A/B review
        uses: actions/upload-artifact@v5
        with:
          name: phase6-long-ab
          path: |
            dist/listening/phase6-long.html
            dist/listening/audio/phase6/*-180s-*.wav
            dist/listening/audio/phase6/*-300s-*.wav
            dist/listening/presets/phase6/
            dist/listening/presets/v021/
          if-no-files-found: error
          retention-days: 14
