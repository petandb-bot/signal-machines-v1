name: Verify pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify production AudioWorklet and legacy presets
        run: npm run verify:build
      - name: Verify opt-in LIVING modes in emitted worklet
        run: node scripts/verify-living-worklet.mjs
      - name: Verify SYMPATHY in emitted worklet
        run: node scripts/verify-sympathy-worklet.mjs
      - name: Validate Phase 1 audio architecture
        run: node scripts/render-sound-architecture.mjs 60
      - name: Render WALLS and independent preset comparisons
        run: |
          npm run render:phase5
          mkdir -p dist/listening/audio dist/listening/presets
          cp -R public/listening/audio/phase5 dist/listening/audio/
          cp -R public/listening/studies dist/listening/
          cp -R public/listening/presets/curated dist/listening/presets/
          cp public/listening/phase5-*.html dist/listening/
      - name: Upload WALLS comparisons
        uses: actions/upload-artifact@v5
        with:
          name: phase5-walls-comparisons
          path: |
            dist/listening/phase5-walls.html
            dist/listening/audio/phase5/spatial-*.wav
            dist/listening/audio/phase5/walls-ir-*.wav
            dist/listening/audio/phase5/study-*.wav
            dist/listening/audio/phase5/walls-report.json
            dist/listening/studies/near-object.json
            dist/listening/studies/distant-material.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload musical preset comparisons
        uses: actions/upload-artifact@v5
        with:
          name: phase5-musical-presets
          path: |
            dist/listening/phase5-presets.html
            dist/listening/audio/phase5/balance-*.wav
            dist/listening/audio/phase5/balance-*.json
            dist/listening/audio/phase5/room-proposal-*.wav
            dist/listening/studies/room-air-low-cut.json
            dist/listening/presets/curated/
          if-no-files-found: error
          retention-days: 14
