name: Verify pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build the app
        run: npm run build
      - name: Verify production AudioWorklet
        run: npm run verify:build
      - name: Verify SYMPATHY worklet at both output rates
        run: node scripts/verify-sympathy-worklet.mjs
      - name: Render Phase 3.1 before/after comparisons
        run: |
          node scripts/render-sympathy-excitation.mjs
          mkdir -p dist/listening/audio
          cp -R public/listening/audio/sympathy-phase31 dist/listening/audio/
      - name: Upload comparative sound studies
        uses: actions/upload-artifact@v5
        with:
          name: phase31-sympathy-excitation
          path: |
            dist/listening/sympathy-excitation.html
            dist/listening/audio/sympathy-phase31/
          if-no-files-found: error
          retention-days: 14
