name: Verify pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build the app
        run: npm run build
      - name: Verify production AudioWorklet
        run: npm run verify:build
      - name: Upload comparative sound studies
        uses: actions/upload-artifact@v5
        with:
          name: four-machines-listening
          path: dist/listening/
          if-no-files-found: error
          retention-days: 14
